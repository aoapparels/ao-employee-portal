<script>

    /*
     * Keyboard Navigation
     * Enter     = Next Field
     * Shift+Enter = Previous Field
     */
    const fields = Array.from(
        document.querySelectorAll(
            'input:not([type="button"]), select, textarea'
        )
    );

    fields.forEach((field, index) => {

        field.addEventListener('keydown', function(e) {

            if (e.key === 'Enter') {

                e.preventDefault();

                if (e.shiftKey) {
                    // Previous field
                    if (index > 0) {
                        fields[index - 1].focus();
                    }
                } else {
                    // Next field
                    if (index < fields.length - 1) {
                        fields[index + 1].focus();
                    } else {
                        document.querySelector('.btn-save').focus();
                    }
                }
            }
        });

    });


    let editingTemporaryId = new URLSearchParams(window.location.search).get("temporary_id") || "";

    function showSaveStatus(message, type="success") {
        const el = document.getElementById("saveStatus");
        if(!el) return;
        el.style.display = "block";
        el.style.background = type === "error" ? "#fff0f0" : "#eef9f1";
        el.style.border = type === "error" ? "1px solid #f0b8b8" : "1px solid #b9dfc3";
        el.style.color = type === "error" ? "#a12626" : "#23743a";
        el.textContent = message;
    }

    function showTemporaryId(id) {
        const box = document.getElementById("temporaryIdBox");
        const value = document.getElementById("temporaryIdValue");
        if(box && value && id){
            value.textContent = id;
            box.style.display = "block";
        }
    }

    function collectFormData() {
        const data = {};
        document.querySelectorAll("input[name], select[name], textarea[name]").forEach(field => {
            data[field.name] = field.value;
        });
        return data;
    }

    function fillFormData(data) {
        document.querySelectorAll("input[name], select[name], textarea[name]").forEach(field => {
            if(Object.prototype.hasOwnProperty.call(data, field.name) && data[field.name] !== null && data[field.name] !== undefined){
                field.value = data[field.name];
            }
        });
    }

    async function loadExistingRegistration() {
        if(!editingTemporaryId) return;
        showSaveStatus("Loading registration for editing...", "success");
        const { data, error } = await supabaseClient
            .from("Employee_Registration")
            .select("*")
            .eq("temporary_id", editingTemporaryId)
            .maybeSingle();
        if(error || !data){
            showSaveStatus(error ? "Load failed: " + error.message : "Registration not found.", "error");
            return;
        }
        fillFormData(data);
        showTemporaryId(data.temporary_id);
        document.querySelector(".btn-save").textContent = "Update Entry";
        showSaveStatus("Editing Temporary ID: " + data.temporary_id, "success");
    }

    async function saveEntry() {
        const requiredFields = document.querySelectorAll('[required]');
        let valid = true;
        requiredFields.forEach(field => {
            if (!String(field.value || '').trim()) {
                field.focus();
                valid = false;
            }
        });
        if (!valid) {
            showSaveStatus("Please fill in all required fields.", "error");
            return;
        }

        const button = document.querySelector('.btn-save');
        if(button) button.disabled = true;
        try {
            const formData = collectFormData();
            if(editingTemporaryId){
                const { data, error } = await supabaseClient
                    .from("Employee_Registration")
                    .update(formData)
                    .eq("temporary_id", editingTemporaryId)
                    .select("*")
                    .single();
                if(error) throw error;
                showTemporaryId(data.temporary_id);
                showSaveStatus("Employee registration updated successfully. Temporary ID: " + data.temporary_id);
            }else{
                const { data, error } = await supabaseClient
                    .from("Employee_Registration")
                    .insert([formData])
                    .select("*")
                    .single();
                if(error) throw error;
                editingTemporaryId = String(data.temporary_id || "");
                showTemporaryId(editingTemporaryId);
                history.replaceState(null, "", "empdataentry.html?temporary_id=" + encodeURIComponent(editingTemporaryId));
                if(button) button.textContent = "Update Entry";
                showSaveStatus("Employee registration saved successfully. Temporary ID: " + editingTemporaryId);
            }
        } catch(error) {
            console.error(error);
            showSaveStatus("Save failed: " + (error.message || error), "error");
        } finally {
            if(button) button.disabled = false;
        }
    }


    function printPage() {
        const getValue = (name) => {
            const field = document.querySelector(`[name="${name}"]`);
            if (!field) return "";
            if (field.tagName === "SELECT") {
                return field.options[field.selectedIndex]?.text || "";
            }
            return field.value || "";
        };

        const esc = (value) => String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;")
            .replace(/\n/g, "<br>");

        const data = [
            ["1. Name of Employee", "employee_name"],
            ["2. Father's Name", "father_name"],
            ["3. Spouse Name", "spouse_name"],
            ["4. Care Of", "care_of"],
            ["5. Date of Birth", "date_of_birth"],
            ["6. NID / Birth ID", "nid_birth_id"],
            ["13. Joining Date", "joining_date"],
            ["14. Designation", "designation"],
            ["15. Section", "section"],
            ["7. Present Address", "present_address"],
            ["8. Permanent Address", "permanent_address"],
            ["9. Mobile No.", "mobile"],
            ["10. Blood Group", "blood_group"],
            ["11. Emergency Number", "emergency_number"],
            ["Emergency Contact Relation", "emergency_relation"],
            ["12. Identifier's Number", "identifier_number"],
            ["Identifier's Name", "identifier_name"],
            ["Identifier Relation", "identifier_relation"],
            ["16. Educational Qualification", "education"],
            ["17. Employment Experience", "employment_experience"],
            ["Institute Name", "institute_name"],
            ["No. of Sons", "sons"],
            ["No. of Daughters", "daughters"],
            ["Height", "height"],
            ["Weight", "weight"]
        ];

        const rows = data.map(([label, name]) => `
            <tr>
                <td class="label">${esc(label)}</td>
                <td>${esc(getValue(name)) || "&nbsp;"}</td>
            </tr>
        `).join("");

        const printWindow = window.open("", "_blank", "width=900,height=1000");

        if (!printWindow) {
            alert("Please allow pop-ups for this page to open the print form.");
            return;
        }

        printWindow.document.write(`
